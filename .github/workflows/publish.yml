# Releases release-kit itself through its own release.yml, so every release of it runs the publish
# and attestation steps for real. After a vX.Y.Z release, move the major tag to it:
#   git tag -f v1 vX.Y.Z && git push -f origin v1
name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      files: |
        .github/workflows/release.yml
        src/Update-FromGitHubRelease.ps1
